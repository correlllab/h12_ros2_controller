sweeps:
  position_cost: [20.0]
  orientation_cost: [10.0]
  lm_damping: [1.0]

fk_roundtrip:
  enabled: false
  samples: 500
  seed: 0
  frame: left_wrist_yaw_link
  joint_limit_margin: 0.05
