  - name: left_pick_x35_y20_z18
    frame: left_wrist_yaw_link
    target_pose: [0.350, 0.200, 0.180, 0.0, 1.57079632679, 0.0]
  - name: left_pick_x35_y30_z06
    frame: left_wrist_yaw_link
