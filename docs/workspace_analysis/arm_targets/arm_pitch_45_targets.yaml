joint_limit_policy: Intersection of analyzed software clips and current URDF limits, with 0.05 rad clearance;
    filter incompatible source witnesses
authoritative_representation: target_position and target_rpy_degrees for the named grasp frame; arm_configuration
    is a verified IK witness
non_arm_configuration: All other joints, including torso and opposite arm, locked at zero
training_requirement: Use all seven joints per active arm and a grasp-frame pose objective. The current
    mjlab ALMI manipulation parser uses only four proximal joints and does not enforce these Cartesian
    poses or wrist orientations.
screening:
    position_tolerance_m: 0.001
    angular_tolerance_rad: 0.005
    joint_limit_clearance_rad: 0.05
    minimum_translational_jacobian_singular_value: 0.06
    collision_model: Full-body sphere URDF with SRDF exclusions, single active arm
    scope: Static endpoints only; transitions and simultaneous arm pairs not checked
    camera: Head color optical frustum and minimum depth; no occlusion test
selection:
    method: 8 nearest feasible corners + 6 nearest grid face centers + nearest grid center + 10 greedy
        farthest points in box-normalized coordinates
    grid_step_m: 0.025
    targets_per_arm: 25
    coverage_scope: Published camera-visible working boxes, not the full reachable cloud
    tie_break: Lexicographic x, y, z; nearest anchors can differ from ideal by half a grid cell
