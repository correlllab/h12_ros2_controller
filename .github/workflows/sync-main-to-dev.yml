name: Sync main to dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-dev
  cancel-in-progress: false

jobs:
  sync:
    name: Generate dev from main
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate dev and regenerate dependency files
        run: |
          set -euo pipefail
          source_main="$(git rev-parse HEAD)"

          # Fetch dev so --force-with-lease can verify it was not updated concurrently,
          # and so the dev-only submodule metadata can be restored.
          git fetch origin dev

          for submodule_path in submodules/unitree_sdk2_python submodules/CL_Assets; do
            if [ -z "$(git ls-tree origin/dev "$submodule_path")" ]; then
              echo "origin/dev does not contain $submodule_path" >&2
              exit 1
            fi
          done
          if [ -z "$(git ls-tree origin/dev .gitmodules)" ]; then
            echo "origin/dev does not contain .gitmodules" >&2
            exit 1
          fi

          git checkout origin/dev -- .gitmodules submodules/unitree_sdk2_python submodules/CL_Assets
          git submodule sync --recursive
          git submodule update --init --recursive
          if [ ! -f submodules/unitree_sdk2_python/pyproject.toml ]; then
            echo "submodules/unitree_sdk2_python was not initialized correctly" >&2
            exit 1
          fi
          if [ ! -d submodules/CL_Assets/ros_assets ]; then
            echo "submodules/CL_Assets was not initialized correctly" >&2
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path('pyproject.toml')
          text = path.read_text()
          main = '[tool.uv.workspace]\nmembers = [\n    "../../../unitree_sdk2_python",\n]'
          dev = '[tool.uv.workspace]\nmembers = [\n    "submodules/unitree_sdk2_python",\n]'
          if main in text:
              path.write_text(text.replace(main, dev))
          elif dev not in text:
              raise SystemExit('Expected [tool.uv.workspace] members block was not found')

          path = Path('README.md')
          text = path.read_text()
          main = (
              '- The `main` branch is meant to be compatible with '
              '[GOLEM](https://github.com/correlllab/GOLEM), '
              'so place Unitree SDK at `../../../unitree_sdk2_python` and CL_Assets '
              'at `../../../CL_Assets` relative to the repo root.\n'
              '- The [dev branch](https://github.com/correlllab/h12_ros2_controller/tree/dev) '
              'is for local testing.'
          )
          dev = (
              '- Download both dependencies under `submodules/` by initializing git submodules:\n\n'
              '  ```bash\n'
              '  git submodule update --init --recursive\n'
              '  ```'
          )
          if main in text:
              path.write_text(text.replace(main, dev))

          path = Path('h12_ros2_controller/utility/path_definition.py')
          lines = path.read_text().splitlines()
          for index, line in enumerate(lines):
              if line.startswith('ASSETS_PATH = '):
                  lines[index] = "ASSETS_PATH = str(PROJECT_ROOT / 'submodules' / 'CL_Assets')"
                  break
          else:
              raise SystemExit('Expected ASSETS_PATH definition was not found')
          path.write_text('\n'.join(lines) + '\n')

          for path in Path('config').glob('*.yaml'):
              if path.name == 'sim_safety_split.yaml':
                  continue
              text = path.read_text()
              if 'domain_id: 0' in text:
                  path.write_text(text.replace('domain_id: 0', 'domain_id: 1'))
              elif 'domain_id: 1' not in text:
                  raise SystemExit(f'Expected domain_id in {path}')
          PY

          uv sync
          uv export --format requirements-txt --no-hashes -o requirements.txt

          git add -A .gitmodules submodules/unitree_sdk2_python submodules/CL_Assets pyproject.toml uv.lock requirements.txt README.md h12_ros2_controller/utility/path_definition.py config
          if git diff --cached --quiet; then
            echo "No changes to commit on dev."
            exit 0
          fi

          git commit -m "Sync main to dev" -m "Source-main: ${source_main}"
          git push --force-with-lease origin HEAD:dev
