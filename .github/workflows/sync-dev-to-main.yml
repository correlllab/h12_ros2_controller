name: Sync dev to main

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-dev
  cancel-in-progress: false

jobs:
  sync:
    name: Generate main from dev
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate main and regenerate dependency files
        run: |
          set -euo pipefail
          source_dev="$(git rev-parse HEAD)"

          git submodule sync --recursive
          git submodule update --init --recursive submodules/unitree_sdk2_python

          # Preserve the SDK from dev at the path used by GOLEM packaging.
          if [ ! -f submodules/unitree_sdk2_python/pyproject.toml ]; then
            echo "submodules/unitree_sdk2_python was not initialized correctly" >&2
            exit 1
          fi
          rm -rf ../../../unitree_sdk2_python
          cp -a submodules/unitree_sdk2_python ../../../unitree_sdk2_python

          # Fetch main so --force-with-lease can verify it was not updated concurrently.
          git fetch origin main

          # main should not ship submodule config, gitlinks, or the submodules directory.
          for submodule_path in submodules/unitree_sdk2_python submodules/CL_Assets; do
            if git ls-files --error-unmatch "$submodule_path" >/dev/null 2>&1; then
              git submodule deinit -f "$submodule_path" || true
              git rm -f "$submodule_path"
            fi
            rm -rf ".git/modules/$submodule_path" "$submodule_path"
          done
          rm -f .gitmodules
          rm -rf submodules

          python3 - <<'PY'
          from pathlib import Path

          path = Path('pyproject.toml')
          text = path.read_text()
          old = '[tool.uv.workspace]\nmembers = [\n    "submodules/unitree_sdk2_python",\n]'
          new = '[tool.uv.workspace]\nmembers = [\n    "../../../unitree_sdk2_python",\n]'
          if old in text:
              path.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit('Expected [tool.uv.workspace] members block was not found')

          path = Path('README.md')
          text = path.read_text()
          old = (
              '- Download both dependencies under `submodules/` by initializing git submodules:\n\n'
              '  ```bash\n'
              '  git submodule update --init --recursive\n'
              '  ```'
          )
          new = (
              '- The `main` branch is meant to be compatible with '
              '[GOLEM](https://github.com/correlllab/GOLEM), '
              'so place Unitree SDK at `../../../unitree_sdk2_python` and CL_Assets '
              'at `../../../CL_Assets` relative to the repo root.\n'
              '- The [dev branch](https://github.com/correlllab/h12_ros2_controller/tree/dev) '
              'is for local testing.'
          )
          if old in text:
              path.write_text(text.replace(old, new))
          elif new not in text:
              raise SystemExit('Expected README submodule installation block was not found')

          path = Path('h12_ros2_controller/utility/path_definition.py')
          lines = path.read_text().splitlines()
          for index, line in enumerate(lines):
              if line.startswith('ASSETS_PATH = '):
                  lines[index] = "ASSETS_PATH = str(PROJECT_ROOT / '../../../CL_Assets')"
                  break
          else:
              raise SystemExit('Expected ASSETS_PATH definition was not found')
          path.write_text('\n'.join(lines) + '\n')

          for path in Path('config').glob('*.yaml'):
              if path.name == 'sim_safety_split.yaml':
                  continue
              text = path.read_text()
              if 'domain_id: 1' in text:
                  path.write_text(text.replace('domain_id: 1', 'domain_id: 0'))
              elif 'domain_id: 0' not in text:
                  raise SystemExit(f'Expected domain_id in {path}')
          PY

          uv sync
          uv export --format requirements-txt --no-hashes -o requirements.txt

          git add -A . config
          if git diff --cached --quiet; then
            echo "No changes to commit on main."
            exit 0
          fi

          git commit -m "Sync dev to main" -m "Source-dev: ${source_dev}"
          git push --force-with-lease origin HEAD:main
