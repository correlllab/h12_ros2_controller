mode: debug

topics:
  low_cmd: rt/lowcmd
  low_state: rt/lowstate

network:
  domain_id: 0
  interface: ''

controller:
  v_lim: 1.0
  w_lim: 2.0
  dq_lim: 1.0
  d_min: 0.02
  timeout: 10.0
  torso_target: 0.0
  threshold_ik: 0.001
  threshold_joint: 0.01
  threshold_linear: 0.002
  threshold_angular: 0.01

frequency:
  ctrl_hz: 50
  pub_hz: 500
  check_hz: 1000

gains:
  # upper-body gains only; lower-body gains default to 0
  kp:
    - 200.0 # torso_joint
    - 300.0 # left_shoulder_pitch_joint
    - 250.0 # left_shoulder_roll_joint
    - 200.0 # left_shoulder_yaw_joint
    - 180.0 # left_elbow_joint
    - 120.0 # left_wrist_roll_joint
    - 150.0 # left_wrist_pitch_joint
    - 120.0 # left_wrist_yaw_joint
    - 300.0 # right_shoulder_pitch_joint
    - 250.0 # right_shoulder_roll_joint
    - 200.0 # right_shoulder_yaw_joint
    - 180.0 # right_elbow_joint
    - 120.0 # right_wrist_roll_joint
    - 150.0 # right_wrist_pitch_joint
    - 120.0 # right_wrist_yaw_joint
  kd:
    - 10.0 # torso_joint
    - 10.0 # left_shoulder_pitch_joint
    - 8.0  # left_shoulder_roll_joint
    - 4.0  # left_shoulder_yaw_joint
    - 4.0  # left_elbow_joint
    - 2.0  # left_wrist_roll_joint
    - 2.0  # left_wrist_pitch_joint
    - 2.0  # left_wrist_yaw_joint
    - 10.0 # right_shoulder_pitch_joint
    - 8.0  # right_shoulder_roll_joint
    - 4.0  # right_shoulder_yaw_joint
    - 4.0  # right_elbow_joint
    - 2.0  # right_wrist_roll_joint
    - 2.0  # right_wrist_pitch_joint
    - 2.0  # right_wrist_yaw_joint
  ki:
    - 60.0 # torso_joint
    - 60.0 # left_shoulder_pitch_joint
    - 60.0 # left_shoulder_roll_joint
    - 60.0 # left_shoulder_yaw_joint
    - 60.0 # left_elbow_joint
    - 60.0 # left_wrist_roll_joint
    - 60.0 # left_wrist_pitch_joint
    - 60.0 # left_wrist_yaw_joint
    - 60.0 # right_shoulder_pitch_joint
    - 60.0 # right_shoulder_roll_joint
    - 60.0 # right_shoulder_yaw_joint
    - 60.0 # right_elbow_joint
    - 60.0 # right_wrist_roll_joint
    - 60.0 # right_wrist_pitch_joint
    - 60.0 # right_wrist_yaw_joint

limits:
  clip:
    position_offset: 0.001
    velocity_ratio: 0.10
    torque_ratio: 0.30
  estop:
    position_offset: 0.0001
    velocity_ratio:
      - 0.20 # torso_joint
      - 0.30 # left_shoulder_pitch_joint
      - 0.20 # left_shoulder_roll_joint
      - 0.20 # left_shoulder_yaw_joint
      - 0.20 # left_elbow_joint
      - 0.20 # left_wrist_roll_joint
      - 0.20 # left_wrist_pitch_joint
      - 0.20 # left_wrist_yaw_joint
      - 0.30 # right_shoulder_pitch_joint
      - 0.20 # right_shoulder_roll_joint
      - 0.20 # right_shoulder_yaw_joint
      - 0.20 # right_elbow_joint
      - 0.20 # right_wrist_roll_joint
      - 0.20 # right_wrist_pitch_joint
      - 0.20 # right_wrist_yaw_joint
    torque_ratio:
      - 0.20 # torso_joint
      - 0.80 # left_shoulder_pitch_joint
      - 0.80 # left_shoulder_roll_joint
      - 0.80 # left_shoulder_yaw_joint
      - 0.80 # left_elbow_joint
      - 0.50 # left_wrist_roll_joint
      - 0.50 # left_wrist_pitch_joint
      - 0.50 # left_wrist_yaw_joint
      - 0.80 # right_shoulder_pitch_joint
      - 0.80 # right_shoulder_roll_joint
      - 0.80 # right_shoulder_yaw_joint
      - 0.80 # right_elbow_joint
      - 0.50 # right_wrist_roll_joint
      - 0.50 # right_wrist_pitch_joint
      - 0.50 # right_wrist_yaw_joint

logging:
  enabled: false
  base_dir: data/control_record
  filename: record
