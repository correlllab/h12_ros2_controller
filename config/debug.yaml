mode: debug

topics:
  low_cmd: rt/lowcmd
  low_state: rt/lowstate

network:
  domain_id: 0
  interface: ''

controller:
  v_lim: 1.0
  w_lim: 2.0
  dq_lim: 1.0
  d_min: 0.02
  timeout: 5.0
  torso_target: 0.0
  threshold_ik: 0.0001
  threshold_joint: 0.001
  threshold_linear: 0.001
  threshold_angular: 0.002

planner:
  # planning backend: ompl (CPU, default) | curobo (CUDA GPU) | auto
  # auto prefers cuRobo when a GPU is present and falls back to OMPL otherwise,
  # so the headless CPU sim (Mac/Colima) keeps working with no changes.
  backend: ompl
  # cuRobo backend settings (only used when backend resolves to curobo)
  # curobo:
  #   # generated from the sphere URDF by config/curobo/gen_curobo_cfg.py
  #   robot_cfg: config/curobo/h1_2_handless_curobo.yml
  #   # absolute host path to the kinematics URDF (keeps robot_cfg host-agnostic)
  #   urdf_path: /path/to/CL_Assets/ros_assets/h1_2_handless_sphere.urdf
  #   world_cfg: /path/to/world.yml         # optional obstacles + ground plane
  #   velocity_scale: 1.0
  #   max_attempts: 4
  #   enable_graph: true
  #   warmup: true
  # OMPL algorithm (used when backend is ompl)
  planner: RRTConnect
  timeout: 1.0
  # example RRT* tuning
  # planner: RRTstar
  # timeout: 3.0
  # range: 0.15
  # planner extension length in joint space
  range: 0.0
  try_direct: true
  simplify: true
  simplify_time: 1.0
  shortcut: true
  # target grasp-frame Cartesian speed in m/s
  moving_speed: 0.30
  min_interpolation_steps: 30
  max_interpolation_steps: 300
  # sampled validity spacing in joint space
  validity_resolution: 0.0025
  # extra samples between returned waypoints
  constraint_check_steps: 10
  frame_names:
    - left_grasp_frame
    - right_grasp_frame
  # global z floor for frame_names
  frame_z_min: 0.0
  # allowed drift below z floor
  frame_z_min_margin: 0.01
  # allowed drift below endpoint z min
  frame_z_corridor_margin: 0.05

frequency:
  ctrl_hz: 30
  pub_hz: 500
  check_hz: 1000

gains:
  # upper-body gains only; lower-body gains default to 0
  kp:
    - 160.0 # torso_joint
    - 240.0 # left_shoulder_pitch_joint
    - 200.0 # left_shoulder_roll_joint
    - 150.0 # left_shoulder_yaw_joint
    - 150.0 # left_elbow_joint
    - 120.0 # left_wrist_roll_joint
    - 120.0 # left_wrist_pitch_joint
    - 120.0 # left_wrist_yaw_joint
    - 240.0 # right_shoulder_pitch_joint
    - 200.0 # right_shoulder_roll_joint
    - 150.0 # right_shoulder_yaw_joint
    - 150.0 # right_elbow_joint
    - 120.0 # right_wrist_roll_joint
    - 120.0 # right_wrist_pitch_joint
    - 120.0 # right_wrist_yaw_joint
  kd:
    - 10.0 # torso_joint
    - 12.0 # left_shoulder_pitch_joint
    - 12.0 # left_shoulder_roll_joint
    - 12.0 # left_shoulder_yaw_joint
    - 12.0 # left_elbow_joint
    - 12.0 # left_wrist_roll_joint
    - 12.0 # left_wrist_pitch_joint
    - 12.0 # left_wrist_yaw_joint
    - 12.0 # right_shoulder_pitch_joint
    - 12.0 # right_shoulder_roll_joint
    - 12.0 # right_shoulder_yaw_joint
    - 12.0 # right_elbow_joint
    - 12.0 # right_wrist_roll_joint
    - 12.0 # right_wrist_pitch_joint
    - 12.0 # right_wrist_yaw_joint
  ki:
    - 60.0 # torso_joint
    - 600.0 # left_shoulder_pitch_joint
    - 600.0 # left_shoulder_roll_joint
    - 400.0 # left_shoulder_yaw_joint
    - 400.0 # left_elbow_joint
    - 100.0 # left_wrist_roll_joint
    - 100.0 # left_wrist_pitch_joint
    - 100.0 # left_wrist_yaw_joint
    - 600.0 # right_shoulder_pitch_joint
    - 600.0 # right_shoulder_roll_joint
    - 400.0 # right_shoulder_yaw_joint
    - 400.0 # right_elbow_joint
    - 100.0 # right_wrist_roll_joint
    - 100.0 # right_wrist_pitch_joint
    - 100.0 # right_wrist_yaw_joint

limits:
  clip:
    position_offset: 0.005
    velocity_ratio: 0.10
    torque_ratio: 0.60
  estop:
    position_offset: 0.0
    velocity_ratio:
      - 0.30 # torso_joint
      - 0.60 # left_shoulder_pitch_joint
      - 0.60 # left_shoulder_roll_joint
      - 0.60 # left_shoulder_yaw_joint
      - 0.60 # left_elbow_joint
      - 0.60 # left_wrist_roll_joint
      - 0.60 # left_wrist_pitch_joint
      - 0.60 # left_wrist_yaw_joint
      - 0.60 # right_shoulder_pitch_joint
      - 0.60 # right_shoulder_roll_joint
      - 0.60 # right_shoulder_yaw_joint
      - 0.60 # right_elbow_joint
      - 0.60 # right_wrist_roll_joint
      - 0.60 # right_wrist_pitch_joint
      - 0.60 # right_wrist_yaw_joint
    torque_ratio:
      - 0.50 # torso_joint
      - 1.00 # left_shoulder_pitch_joint
      - 1.00 # left_shoulder_roll_joint
      - 1.00 # left_shoulder_yaw_joint
      - 1.00 # left_elbow_joint
      - 1.00 # left_wrist_roll_joint
      - 1.00 # left_wrist_pitch_joint
      - 1.00 # left_wrist_yaw_joint
      - 1.00 # right_shoulder_pitch_joint
      - 1.00 # right_shoulder_roll_joint
      - 1.00 # right_shoulder_yaw_joint
      - 1.00 # right_elbow_joint
      - 1.00 # right_wrist_roll_joint
      - 1.00 # right_wrist_pitch_joint
      - 1.00 # right_wrist_yaw_joint

logging:
  enabled: false
  base_dir: data/control_record
  filename: record
