mode: debug

topics:
  low_cmd: rt/lowcmd
  low_state: rt/lowstate

network:
  domain_id: 1
  interface: ''

controller:
  v_lim: 1.0
  w_lim: 2.0
  dq_lim: 1.0
  d_min: 0.02
  timeout: 5.0
  torso_target: 0.0
  threshold_ik: 0.0001
  threshold_joint: 0.01
  threshold_linear: 0.001
  threshold_angular: 0.002
  execution_start_tolerance: 0.01
  command_seed_max_gap: 0.10
  frozen_joint_tolerance: 0.01
  plan_max_age: 30.0

planner:
  planner: RRTConnect
  timeout: 1.0
  # example RRT* tuning
  # planner: RRTstar
  # timeout: 3.0
  # range: 0.15
  # planner extension length in joint space
  range: 0.0
  try_direct: true
  simplify: true
  simplify_time: 1.0
  # target grasp-frame Cartesian speed in m/s
  moving_speed: 0.30
  min_interpolation_steps: 30
  max_interpolation_steps: 600
  joint_acceleration_limit: 25.0
  continuous_timing: true
  frame_rotation_radius: 0.20
  max_ik_candidates: 3
  ik_max_seeds: 8
  ik_seed_timeout: 0.30
  ik_wrist_motion_weight: 3.0
  ik_wrist_posture_cost: 0.005
  ik_shoulder_seed_offset: 0.45
  ik_elbow_seed_offset: 0.60
  ik_reuse_translation: 0.12
  ik_reuse_rotation: 0.50
  candidate_planning_budget: 2.0
  request_planning_budget: 8.0
  bimanual_fallback_budget: 5.0
  bimanual_coordination_knots: 24
  bimanual_coordination_delay: 0.25
  bimanual_refinement_budget: 0.6
  bimanual_refinement_duration: 12.0
  recent_path_cache_size: 6
  nearby_reuse_joint_tolerance: 0.12
  nearby_reuse_knots: 24
  candidate_ompl_timeout: 0.75
  candidate_ik_weight: 0.1
  candidate_hand_weight: 2.0
  candidate_compact_weight: 3.0
  candidate_clearance_weight: 5.0
  candidate_wrist_path_weight: 0.20
  candidate_duration_weight: 0.05
  worker_request_timeout: 10.0
  worker_startup_timeout: 30.0
  # sampled validity spacing in joint space
  validity_resolution: 0.0025
  # extra samples between returned waypoints
  constraint_check_steps: 10
  frame_names:
    - left_grasp_frame
    - right_grasp_frame
  # maximum forward reach for grasp frames
  frame_x_max: 0.60
  # prep grasp-frame y limits
  frame_y_min: -0.45
  frame_y_max: 0.45
  # global z floor for frame_names
  frame_z_min: -0.05
  # zero-pose z references: head camera=0.68789 m, lidar=0.67980 m
  # shoulder z=0.43358 m
  frame_z_max: 0.60
  # allowed drift beyond frame limits
  frame_limit_margin: 0.01
  # allowed drift below endpoint z min
  frame_z_corridor_margin: 0.05
  local_x_backtrack: 0.15
  elbow_x_backtrack: 0.22
  max_local_path_ratio: 2.0
  local_joint_padding: 0.6
  local_search_fraction: 0.35
  max_hand_deviation: 0.45
  compact_radial_slack: 0.08
  preferred_clearance: 0.05
  inactive_goal_tolerance: 0.000001
  # clamp a measured start pose up to this (rad) past a joint limit back into
  # bounds instead of aborting the plan; larger overshoots still fail
  start_limit_tolerance: 0.05

frequency:
  ctrl_hz: 30
  pub_hz: 500

gains:
  # upper-body gains only; lower-body gains default to 0
  kp:
    - 160.0 # torso_joint
    - 240.0 # left_shoulder_pitch_joint
    - 200.0 # left_shoulder_roll_joint
    - 150.0 # left_shoulder_yaw_joint
    - 150.0 # left_elbow_joint
    - 120.0 # left_wrist_roll_joint
    - 120.0 # left_wrist_pitch_joint
    - 120.0 # left_wrist_yaw_joint
    - 240.0 # right_shoulder_pitch_joint
    - 200.0 # right_shoulder_roll_joint
    - 150.0 # right_shoulder_yaw_joint
    - 150.0 # right_elbow_joint
    - 120.0 # right_wrist_roll_joint
    - 120.0 # right_wrist_pitch_joint
    - 120.0 # right_wrist_yaw_joint
  kd:
    - 10.0 # torso_joint
    - 12.0 # left_shoulder_pitch_joint
    - 12.0 # left_shoulder_roll_joint
    - 12.0 # left_shoulder_yaw_joint
    - 12.0 # left_elbow_joint
    - 12.0 # left_wrist_roll_joint
    - 12.0 # left_wrist_pitch_joint
    - 12.0 # left_wrist_yaw_joint
    - 12.0 # right_shoulder_pitch_joint
    - 12.0 # right_shoulder_roll_joint
    - 12.0 # right_shoulder_yaw_joint
    - 12.0 # right_elbow_joint
    - 12.0 # right_wrist_roll_joint
    - 12.0 # right_wrist_pitch_joint
    - 12.0 # right_wrist_yaw_joint
  ki:
    - 60.0 # torso_joint
    - 600.0 # left_shoulder_pitch_joint
    - 600.0 # left_shoulder_roll_joint
    - 400.0 # left_shoulder_yaw_joint
    - 400.0 # left_elbow_joint
    - 100.0 # left_wrist_roll_joint
    - 100.0 # left_wrist_pitch_joint
    - 100.0 # left_wrist_yaw_joint
    - 600.0 # right_shoulder_pitch_joint
    - 600.0 # right_shoulder_roll_joint
    - 400.0 # right_shoulder_yaw_joint
    - 400.0 # right_elbow_joint
    - 100.0 # right_wrist_roll_joint
    - 100.0 # right_wrist_pitch_joint
    - 100.0 # right_wrist_yaw_joint

limits:
  clip:
    position_offset: 0.001
    velocity_ratio: 0.10
    torque_ratio: 0.60

logging:
  enabled: false
  base_dir: data/control_record
  filename: record
