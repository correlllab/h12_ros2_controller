# Sim-only override: loosen estop bounds so neither the controller's
# startup IK nor slider-driven goal updates trip the position/velocity/
# torque guards. The defaults in controller_config.py and debug.yaml are
# tuned for hardware safety; sim has no hardware to protect, so we let
# MuJoCo's physical limits be the only boundary.
# All other settings (mode, gains, frequency, topics) inherit defaults.
mode: debug

topics:
  low_cmd: rt/safety/lowcmd_upper_in
  low_state: rt/lowstate

gains:
  # upper-body gains only; lower-body gains default to 0
  kp:
    - 160.0 # torso_joint
    - 240.0 # left_shoulder_pitch_joint
    - 200.0 # left_shoulder_roll_joint
    - 150.0 # left_shoulder_yaw_joint
    - 150.0 # left_elbow_joint
    - 80.0 # left_wrist_roll_joint
    - 80.0 # left_wrist_pitch_joint
    - 80.0 # left_wrist_yaw_joint
    - 240.0 # right_shoulder_pitch_joint
    - 200.0 # right_shoulder_roll_joint
    - 150.0 # right_shoulder_yaw_joint
    - 150.0 # right_elbow_joint
    - 80.0 # right_wrist_roll_joint
    - 80.0 # right_wrist_pitch_joint
    - 80.0 # right_wrist_yaw_joint
  kd:
    - 10.0 # torso_joint
    - 12.0 # left_shoulder_pitch_joint
    - 10.0 # left_shoulder_roll_joint
    - 10.0 # left_shoulder_yaw_joint
    - 8.0 # left_elbow_joint
    - 8.0 # left_wrist_roll_joint
    - 8.0 # left_wrist_pitch_joint
    - 8.0 # left_wrist_yaw_joint
    - 12.0 # right_shoulder_pitch_joint
    - 10.0 # right_shoulder_roll_joint
    - 10.0 # right_shoulder_yaw_joint
    - 8.0 # right_elbow_joint
    - 8.0 # right_wrist_roll_joint
    - 8.0 # right_wrist_pitch_joint
    - 8.0 # right_wrist_yaw_joint
  ki:
    - 60.0 # torso_joint
    - 600.0 # left_shoulder_pitch_joint
    - 600.0 # left_shoulder_roll_joint
    - 400.0 # left_shoulder_yaw_joint
    - 400.0 # left_elbow_joint
    - 100.0 # left_wrist_roll_joint
    - 100.0 # left_wrist_pitch_joint
    - 100.0 # left_wrist_yaw_joint
    - 600.0 # right_shoulder_pitch_joint
    - 600.0 # right_shoulder_roll_joint
    - 400.0 # right_shoulder_yaw_joint
    - 400.0 # right_elbow_joint
    - 100.0 # right_wrist_roll_joint
    - 100.0 # right_wrist_pitch_joint
    - 100.0 # right_wrist_yaw_joint

limits:
  estop:
    position_offset: 0.0  # no inset off URDF joint limits
    velocity_ratio: 2.0
    torque_ratio: 2.0
