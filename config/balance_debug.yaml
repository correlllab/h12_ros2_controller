mode: debug

topics:
  low_cmd: rt/lowcmd
  low_state: rt/lowstate

network:
  domain_id: 1
  interface: ''

controller:
  v_lim: 1.0
  w_lim: 2.0
  dq_lim: 1.0
  d_min: 0.02
  timeout: 5.0
  torso_target: 0.0
  threshold_ik: 0.0001
  threshold_joint: 0.001
  threshold_linear: 0.001
  threshold_angular: 0.002

momentum_ddp:
  enabled: true
  arm: left
  dt: 0.04
  hold_duration: 0.16
  momentum_duration: 0.36
  return_duration: 0.56
  maxiter: 2
  w_momentum: 120.0
  w_u: 0.002
  w_limit: 100.0
  max_velocity: 8.0

zmp:
  enabled: false
  mode: both_arm_balance
  assist_arm: right
  thresholds:
    zmp_error: 0.012
    support_margin: 0.03
    center_shift: 0.018
    com_velocity: 0.04
    angular_velocity: 0.08
    angular_acceleration: 0.5
    force_proxy: 10.0
  target:
    response_time: 0.16
    min_momentum_norm: 0.3
    max_momentum:
      - 1.5
      - 1.5
      - 0.0
  hysteresis:
    enter_cycles: 1
    exit_cycles: 6
  observer:
    center_reference_alpha: 0.02
    angular_acceleration_alpha: 0.35
    com_acceleration_alpha: 0.20
    support_offset:
      - 0.0
      - 0.0
    support_half_extents:
      - 0.12
      - 0.06
  blending:
    interrupt_ticks: 3
  execution:
    limit_ddp_velocity: false
  gains:
    zmp:
      - 1.0
      - 1.0
    center:
      - 0.5
      - 0.5
    com_velocity:
      - 0.4
      - 0.4
    angular_acceleration:
      - 0.0
      - 0.0
  allocation:
    left_weight: 0.5
    right_weight: 0.5
  ddp:
    hold_duration: 0.0
    momentum_duration: 0.36
    return_duration: 0.56
    return_timeout: 1.0
    min_replan_interval: 0.12
    maxiter: 2
    w_momentum: 100.0
    w_u: 0.002
    w_limit: 100.0
    max_velocity: 8.0
    hold_w_q: 60.0
    swing_w_q: 0.5
    return_w_q: 60.0
    terminal_w_q: 120.0
    hold_w_momentum: 20.0
    return_w_momentum: 10.0
    terminal_w_momentum: 20.0
  solver_failure:
    allow_single_arm_success: true
    accept_best_effort: true
    min_alignment: 0.2
    min_useful_momentum: 0.1
    suppressed_warning_interval: 1.0

frequency:
  ctrl_hz: 30
  pub_hz: 500
  check_hz: 1000

gains:
  # upper-body gains only; lower-body gains default to 0
  kp:
    - 160.0 # torso_joint
    - 240.0 # left_shoulder_pitch_joint
    - 200.0 # left_shoulder_roll_joint
    - 150.0 # left_shoulder_yaw_joint
    - 150.0 # left_elbow_joint
    - 80.0 # left_wrist_roll_joint
    - 80.0 # left_wrist_pitch_joint
    - 80.0 # left_wrist_yaw_joint
    - 240.0 # right_shoulder_pitch_joint
    - 200.0 # right_shoulder_roll_joint
    - 150.0 # right_shoulder_yaw_joint
    - 150.0 # right_elbow_joint
    - 80.0 # right_wrist_roll_joint
    - 80.0 # right_wrist_pitch_joint
    - 80.0 # right_wrist_yaw_joint
  kd:
    - 10.0 # torso_joint
    - 12.0 # left_shoulder_pitch_joint
    - 10.0 # left_shoulder_roll_joint
    - 10.0 # left_shoulder_yaw_joint
    - 8.0 # left_elbow_joint
    - 8.0 # left_wrist_roll_joint
    - 8.0 # left_wrist_pitch_joint
    - 8.0 # left_wrist_yaw_joint
    - 12.0 # right_shoulder_pitch_joint
    - 10.0 # right_shoulder_roll_joint
    - 10.0 # right_shoulder_yaw_joint
    - 8.0 # right_elbow_joint
    - 8.0 # right_wrist_roll_joint
    - 8.0 # right_wrist_pitch_joint
    - 8.0 # right_wrist_yaw_joint
  ki:
    - 60.0 # torso_joint
    - 600.0 # left_shoulder_pitch_joint
    - 600.0 # left_shoulder_roll_joint
    - 400.0 # left_shoulder_yaw_joint
    - 400.0 # left_elbow_joint
    - 100.0 # left_wrist_roll_joint
    - 100.0 # left_wrist_pitch_joint
    - 100.0 # left_wrist_yaw_joint
    - 600.0 # right_shoulder_pitch_joint
    - 600.0 # right_shoulder_roll_joint
    - 400.0 # right_shoulder_yaw_joint
    - 400.0 # right_elbow_joint
    - 100.0 # right_wrist_roll_joint
    - 100.0 # right_wrist_pitch_joint
    - 100.0 # right_wrist_yaw_joint

limits:
  clip:
    position_offset: 0.001
    velocity_ratio: 0.10
    torque_ratio: 0.60
  estop:
    position_offset: 0.0001
    velocity_ratio:
      - 1.00 # torso_joint
      - 1.00 # left_shoulder_pitch_joint
      - 1.00 # left_shoulder_roll_joint
      - 1.00 # left_shoulder_yaw_joint
      - 1.00 # left_elbow_joint
      - 1.00 # left_wrist_roll_joint
      - 1.00 # left_wrist_pitch_joint
      - 1.00 # left_wrist_yaw_joint
      - 1.00 # right_shoulder_pitch_joint
      - 1.00 # right_shoulder_roll_joint
      - 1.00 # right_shoulder_yaw_joint
      - 1.00 # right_elbow_joint
      - 1.00 # right_wrist_roll_joint
      - 1.00 # right_wrist_pitch_joint
      - 1.00 # right_wrist_yaw_joint
    torque_ratio:
      - 1.00 # torso_joint
      - 1.00 # left_shoulder_pitch_joint
      - 1.00 # left_shoulder_roll_joint
      - 1.00 # left_shoulder_yaw_joint
      - 1.00 # left_elbow_joint
      - 1.00 # left_wrist_roll_joint
      - 1.00 # left_wrist_pitch_joint
      - 1.00 # left_wrist_yaw_joint
      - 1.00 # right_shoulder_pitch_joint
      - 1.00 # right_shoulder_roll_joint
      - 1.00 # right_shoulder_yaw_joint
      - 1.00 # right_elbow_joint
      - 1.00 # right_wrist_roll_joint
      - 1.00 # right_wrist_pitch_joint
      - 1.00 # right_wrist_yaw_joint

logging:
  enabled: false
  base_dir: data/control_record
  filename: record
