    position_offset: 0.05
    velocity_ratio: 0.08
    torque_ratio: 0.25
  estop:
    position_offset: 0.002
    velocity_ratio:
      - 0.15 # left_hip_yaw_joint
      - 0.15 # left_hip_pitch_joint
      - 0.20 # left_hip_roll_joint
      - 0.45 # left_knee_joint
      - 0.40 # left_ankle_pitch_joint
