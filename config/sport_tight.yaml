    - 50.0 # right_elbow_joint
    - 20.0 # right_wrist_roll_joint
    - 20.0 # right_wrist_pitch_joint
    - 20.0 # right_wrist_yaw_joint
  kd:
    - 8.0  # left_hip_yaw_joint
    - 15.0 # left_hip_pitch_joint
    - 15.0 # left_hip_roll_joint
    - 10.0 # left_knee_joint
    - 5.0  # left_ankle_pitch_joint
    - 5.0  # left_ankle_roll_joint
    - 8.0  # right_hip_yaw_joint
    - 15.0 # right_hip_pitch_joint
    - 15.0 # right_hip_roll_joint
    - 10.0 # right_knee_joint
    - 5.0  # right_ankle_pitch_joint
    - 5.0  # right_ankle_roll_joint
    - 10.0 # torso_joint
    - 10.0 # left_shoulder_pitch_joint
    - 10.0 # left_shoulder_roll_joint
