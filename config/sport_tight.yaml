mode: sport

topics:
  low_cmd: rt/arm_sdk
  low_state: rt/lowstate

network:
  domain_id: 0
  interface: ''

controller:
  v_lim: 1.0
  w_lim: 2.0
  dq_lim: 1.0
  d_min: 0.02

frequency:
  ctrl_hz: 50
  pub_hz: 500
  check_hz: 1000

