# operator approval of the mechanical model, interface and DDS domain is required
# network matches the real robot bus: domain 0 on enx00e04c681314
# standard upper relay must preserve lower joints and handle the global envelope
mode: debug

topics:
  low_cmd: rt/safety/lowcmd_upper_in
  low_state: rt/lowstate

network:
  domain_id: 0
  interface: 'enx00e04c681314'

controller:
  v_lim: 1.0
  w_lim: 2.0
  dq_lim: 1.0
  d_min: 0.02
  timeout: 5.0
  torso_target: 0.0
  threshold_ik: 0.0001
  threshold_joint: 0.001
  threshold_linear: 0.001
  threshold_angular: 0.002

planner:
  planner: RRTConnect
  timeout: 1.0
  range: 0.0
  try_direct: true
  simplify: true
  simplify_time: 1.0
  shortcut: true
  moving_speed: 0.30
  min_interpolation_steps: 30
  max_interpolation_steps: 300
  validity_resolution: 0.0025
  constraint_check_steps: 10
  frame_names:
    - left_grasp_frame
    - right_grasp_frame
  frame_z_min: 0.0
  frame_z_min_margin: 0.01
  frame_z_corridor_margin: 0.05

frequency:
  ctrl_hz: 30
  pub_hz: 500
  check_hz: 1000

gains:
  # torso followed by the fourteen arms; unchanged safety_split hardware gains
  kp: [160, 240, 200, 150, 150, 120, 120, 120, 240, 200, 150, 150, 120, 120, 120]
  kd: [10, 12, 12, 12, 12, 12, 12, 12, 12, 12, 12, 12, 12, 12, 12]
  ki: [60, 600, 600, 400, 400, 100, 100, 100, 600, 600, 400, 400, 100, 100, 100]

limits:
  clip:
    position_offset: 0.001
    velocity_ratio: 0.10
    torque_ratio: 0.60
  estop:
    position_offset: 0.0
    velocity_ratio: [0.30, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60, 0.60]
    torque_ratio: [0.50, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00, 1.00]

# frozen 3C iteration-6B wide formulation; real hardware caps still intersect it
reactive_counter_balance:
  weights: {com: 1.0, momentum: 2.0, posture: 0.02}
  gains: {com: 2.0, gyro: 0.2, posture: 1.0}
  damping: 0.0001
  max_velocity: [2.6, 3.2, 2.6, 1.5]
  max_excursion: [0.75, 0.58, 0.40, 0.58]

logging:
  enabled: false
  base_dir: data/control_record
  filename: record
