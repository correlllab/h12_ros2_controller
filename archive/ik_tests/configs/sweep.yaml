# Full sweep scaffold. Expands to len(sweeps[position_cost]) *
# len(sweeps[orientation_cost]) * ... trials per case.
# Start from minimal.yaml; only override what you want to sweep.
#
# SAFETY: see note in minimal.yaml. safety_split.yaml is the default
# because this harness only drives upper-body joints.
#
# Cases selected via ik_feasibility.py (2026-04-30):
#   - left/right_forward_low  REMOVED: only 6.7 cm from home, arm barely moves
#   - left/right_forward_high REMOVED: IK solution at joint limit (margin=0.000),
#                                       caused estop in 20260430_134950_sweep_real
#   - New cases replace them with verified reachable targets (disp 0.11–0.19 m,
#     margin >= 0.07 rad) covering forward extension, elbow flex, and side motions.
#
# Solver params locked at position_cost=20, orientation_cost=10, lm_damping=1
# based on 20260430_134950_sweep_real analysis (lowest null-space oscillation).

controller_config: safety_split.yaml
handless: false
urdf:
  body: assets/h1_2/h1_2_magpie.urdf
  sphere: assets/h1_2/h1_2_magpie_sphere.urdf
  srdf: assets/h1_2/h1_2_magpie_sphere_collision.srdf

home: home
home_settle_timeout: 6.0
home_tolerance: 2.0e-2

trials_per_case: 3
return_home_between: true

trial:
  step_timeout: 6.0
  settle_steps: 50
  linear_threshold: 5.0e-3
  angular_threshold: 2.0e-2
  record_ik_optimal: true

orientation_units: rad

# IK feasibility results (home EE: left=[0.234,0.210,0.095], right=[0.234,-0.210,0.095])
#   Tag (in name)   disp    max_jt  margin  joints moved
#   forward_extend  0.116m  25.9°   0.373   shoulder_pitch(-21°), elbow(+26°)
#   forward_mid     0.124m  24.8°   0.029   shoulder_pitch(-15°), wrist_pitch(+25°)
#   side_reach      0.194m  29.9°   0.087   shoulder+elbow multi-joint
#   side_up         0.179m  23.2°   0.074   shoulder_roll(+21°), wrist_roll(-23°)
#   side_low        0.145m  16.1°   0.337   shoulder_roll(+15°), wrist_roll(-16°)
#
# Case names follow {arm}_{tag}_x{XX}_y{YY}_z{ZZ} (cm) so analyze_deep.py can
# parse target xyz from the name — matches sweep_tilt.yaml.
cases:
  - name: left_forward_extend_x35_y20_z10
    frame: left_wrist_yaw_link
    target_pose: [0.35, 0.20, 0.10, 0.0, 0.0, 0.0]
  - name: left_forward_mid_x30_y20_z20
    frame: left_wrist_yaw_link
    target_pose: [0.30, 0.20, 0.20, 0.0, 0.0, 0.0]
  - name: left_side_reach_x15_y35_z20
    frame: left_wrist_yaw_link
    target_pose: [0.15, 0.35, 0.20, 0.0, 0.0, 0.0]
  - name: left_side_up_x20_y35_z20
    frame: left_wrist_yaw_link
    target_pose: [0.20, 0.35, 0.20, 0.0, 0.0, 0.0]
  - name: left_side_low_x20_y35_z08
    frame: left_wrist_yaw_link
    target_pose: [0.20, 0.35, 0.08, 0.0, 0.0, 0.0]
  - name: right_forward_extend_x35_y20_z10
    frame: right_wrist_yaw_link
    target_pose: [0.35, -0.20, 0.10, 0.0, 0.0, 0.0]
  - name: right_forward_mid_x30_y20_z20
    frame: right_wrist_yaw_link
    target_pose: [0.30, -0.20, 0.20, 0.0, 0.0, 0.0]
  - name: right_side_reach_x15_y35_z20
    frame: right_wrist_yaw_link
    target_pose: [0.15, -0.35, 0.20, 0.0, 0.0, 0.0]
  - name: right_side_up_x20_y35_z20
    frame: right_wrist_yaw_link
    target_pose: [0.20, -0.35, 0.20, 0.0, 0.0, 0.0]
  - name: right_side_low_x20_y35_z08
    frame: right_wrist_yaw_link
    target_pose: [0.20, -0.35, 0.08, 0.0, 0.0, 0.0]

# Locked at best settings from 20260430_134950 sweep.
# Extend this list if you want to re-evaluate solver params on the new cases.
sweeps:
  position_cost: [20.0]
  orientation_cost: [10.0]
  lm_damping: [1.0]

fk_roundtrip:
  enabled: false
  samples: 500
  seed: 0
  frame: left_wrist_yaw_link
  joint_limit_margin: 0.05
