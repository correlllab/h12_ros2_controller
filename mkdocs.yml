site_name: h12_ros2_controller
site_description: ROS2 and SDK-based upper-body controller stack for Unitree H1.2
site_url: https://github.com/correlllab/h12_ros2_controller
repo_name: h12_ros2_controller
repo_url: https://github.com/correlllab/h12_ros2_controller
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: amber

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            inherited_members: true
            docstring_style: google

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Hardware and Networking: getting-started/hardware-networking.md
      - First Run: getting-started/first-run.md
  - Guides:
      - Usage Matrix: guides/usage-matrix.md
      - Frame Task Architecture: guides/frame-task-guide.md
      - ROS2 Interfaces: guides/ros2-interfaces.md
      - Scripts and Examples: guides/scripts-and-examples.md
  - Architecture:
      - System Overview: architecture/system-overview.md
      - End-to-End Flow Diagram: architecture/flow-diagram.md
  - API Reference:
      - API Index: api/index.md
      - Core Controllers: api/core-controllers.md
      - Core Runtime: api/core-runtime.md
      - ROS2 Nodes: api/ros2-nodes.md
      - Utilities: api/utilities.md
  - Operations:
      - Safety and Estop: reference/safety.md
      - Troubleshooting: reference/troubleshooting.md
